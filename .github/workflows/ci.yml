name: Techuweb Lead Generator CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    name: Validate Python, Tests and Docker
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Check Python syntax
      - name: Check Python syntax
        run: |
          python -m compileall -q app.py config database models scraper services utils tests

      # Step 5: Run tests from the tests directory
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      # Step 6: Run backup-integrity tests
      - name: Run backup integrity tests
        run: |
          python -m unittest services.test_backup_integrity -v

      # Step 7: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t techuweb-lead-generator:ci .
